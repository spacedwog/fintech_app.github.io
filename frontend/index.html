  <div class="auth-wrapper">

    <div class="auth-card" id="login-box">
      <h1>💰 Fintech SaaS</h1>
      <p class="subtitle">Entre na sua conta</p>

      <div id="login-error" class="error-box hidden"></div>

      <form id="login-form">
        <div class="field">
          <label>E-mail</label>
          <input type="email" id="login-email" required />
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="login-password" required minlength="6" />
        </div>
        <button type="submit" class="primary">Entrar</button>
      </form>

      <p class="switch-link">Ainda não tem conta? <a id="show-signup">Criar empresa</a></p>
    </div>

    <div class="auth-card hidden" id="signup-box">
      <h1>💰 Fintech SaaS</h1>
      <p class="subtitle">Crie sua conta (nova empresa)</p>

      <div id="signup-error" class="error-box hidden"></div>

      <form id="signup-form">
        <div class="field">
          <label>Nome da empresa</label>
          <input type="text" id="signup-company" required />
        </div>
        <div class="field">
          <label>Seu nome</label>
          <input type="text" id="signup-name" required />
        </div>
        <div class="field">
          <label>E-mail</label>
          <input type="email" id="signup-email" required />
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="signup-password" required minlength="6" />
        </div>
        <button type="submit" class="primary">Criar conta</button>
      </form>

      <p class="switch-link">Já tem conta? <a id="show-login">Entrar</a></p>
    </div>

  </div>

  <script src="js/plans.js"></script>
  <script src="js/db.js"></script>
  <script src="js/crypto-utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-page.js"></script>
</body>
</html>
