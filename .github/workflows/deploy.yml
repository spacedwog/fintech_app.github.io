name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  # "actions: write" e usado so pelo job "deploy" para apagar, via gh api,
  # qualquer artifact "github-pages" duplicado antes de subir um novo -- isso
  # e o que causa o erro "Multiple artifacts named github-pages" (e a run
  # travar em deployment_queued) quando alguem usa "Re-run failed jobs" nesse
  # job em vez de "Re-run all jobs" ou um novo push.
  actions: write

concurrency:
  # cancel-in-progress: false (recomendado pelo template oficial do GitHub Pages).
  # Com "true", um push novo mata o job no meio do deploy-pages sem avisar o
  # ambiente "github-pages" -- a implantacao anterior fica presa como
  # "in_progress"/"queued" e a proxima nunca sai de deployment_queued, pois o
  # Pages so libera a fila quando a implantacao anterior termina (ou falha)
  # normalmente, nao quando o job e cancelado a forca.
  group: pages-deploy
  cancel-in-progress: false

env:
  # Secret criado em: Settings > Secrets and variables > Actions > New repository secret
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  python-pipeline:
    name: Comandos Python (lint, testes, pipeline de dados)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar LibreOffice (recalculo de formulas em .xlsx)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Instalar dependencias Python
        run: pip install openpyxl requests

      - name: Lint (py_compile em todos os .py)
        run: |
          find . -name "*.py" -not -path "./.git/*" -print0 \
            | xargs -0 python3 -m py_compile

      - name: Verificar OPENAI_API_KEY
        run: python3 scripts/verify_google_api_key.py

      - name: Testes - fibonacci_laplace_agent
        working-directory: fibonacci_laplace_agent
        run: python3 test_pipeline.py

      - name: Testes - orcamento_agent
        working-directory: orcamento_agent
        run: |
          python3 test_mp_expenses.py
          python3 test_mp_reconcile.py
          python3 test_mp_sync.py
          python3 test_mp_list_activities.py

      - name: Rodar pipeline ETL (Fibonacci + Laplace) de exemplo
        working-directory: fibonacci_laplace_agent
        continue-on-error: true
        run: |
          python3 etl_pipeline.py \
            --planilha ../casamento_do_ano.xlsx \
            --layout ../orcamento_agent/layout.example.json \
            --saida resultado_pipeline.json

      - name: Upload do artifact com a saida do pipeline Python
        uses: actions/upload-artifact@v4
        with:
          name: python-pipeline-output
          path: fibonacci_laplace_agent/resultado_pipeline.json
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Publicar GitHub Pages
    needs: python-pipeline
    runs-on: ubuntu-latest
    # Limite de tempo total do job: se o deploy-pages ficar preso em
    # deployment_queued, o job falha em vez de rodar para sempre.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Apagar artifacts "github-pages" duplicados desta run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "Verificando artifacts existentes na run $RUN_ID..."
          ids=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')
          if [ -z "$ids" ]; then
            echo "Nenhum artifact github-pages duplicado encontrado."
          else
            for id in $ids; do
              echo "Apagando artifact github-pages id=$id (sobra de re-run anterior)"
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || true
            done
          fi

      - name: Criar artifact do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Executar deploy do artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Falha em 5 min em vez de ficar preso ate 10 min (padrao) em
          # deployment_queued -- assim um problema real aparece mais rapido
          # e o proximo push/re-run (via "Re-run all jobs") pode tentar de novo.
          timeout: 300000
