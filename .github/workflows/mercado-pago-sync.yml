name: Mercado Pago — sincronização automática

# Roda, sem intervenção manual, os agentes que já existem em orcamento_agent/:
#   1) mp_reconcile.py — confirma cobranças de Pix (assinatura/despesa extra)
#      já declaradas no painel, cruzando com pagamentos reais do Mercado Pago.
#   2) mp_expenses.py   — gera despesas reais na Página 2 (Registrar Despesas)
#      a partir dos mesmos pagamentos (rode SEMPRE depois do passo 1, ver
#      orcamento_agent/LEIA-ME.md).
#
# Por que GitHub Actions e não o navegador: o site (fintech_app.github.io) é
# 100% estático — o Access Token do Mercado Pago (e a chave do Firebase)
# NUNCA podem ir para o navegador/site público, e a API do Mercado Pago não
# libera CORS para chamadas diretas do front-end de qualquer forma. Actions
# roda num runner temporário do GitHub, fora do navegador, com os segredos
# vindos de Secrets do repositório (nunca do código) — mesmo espírito de
# segurança do restante da suíte (ver orcamento_agent/LEIA-ME.md, seção
# "Segurança").
#
# Configurar (Settings → Secrets and variables → Actions → New repository
# secret, no GitHub, uma vez):
#   MERCADO_PAGO_ACCESS_TOKEN   (obrigatório) — developers.mercadopago.com.br
#                                 → Suas integrações → Credenciais.
#   MP_CONTA_EMAIL               (obrigatório) — e-mail de login no painel
#                                 (dashboard.html) que vai receber as despesas.
#   FIREBASE_SERVICE_ACCOUNT_JSON (obrigatório) — conteúdo INTEIRO do arquivo
#                                 baixado em Console do Firebase → Configurações
#                                 do projeto → Contas de serviço → Gerar nova
#                                 chave privada (cole o JSON completo).
#   MP_JANELA_DIAS                (opcional) — quantos dias para trás buscar a
#                                 cada execução (padrão: 3 — a idempotência dos
#                                 scripts garante que rodar de novo não duplica
#                                 nada, então uma janela com folga é segura).
#   OPEN_FINANCE_TOKEN_ENDPOINT   (opcional) — habilita o agente Open Finance
#                                 quando combinado com os 4 secrets abaixo.
#   OPEN_FINANCE_BASE_URL         (opcional) — base da API Open Finance.
#   OPEN_FINANCE_CLIENT_ID        (opcional) — client_id OAuth Open Finance.
#   OPEN_FINANCE_CLIENT_SECRET    (opcional) — client_secret OAuth Open Finance.
#   OPEN_FINANCE_CARD_TOKEN_SECRET (opcional) — segredo para tokenização estável
#                                 dos IDs de cartão (não armazena PAN/CVV).
#   MP_OAUTH_CLIENT_ID            (opcional) — habilita sync OAuth da conta MP
#                                 quando combinado com os 2 secrets abaixo.
#   MP_OAUTH_CLIENT_SECRET        (opcional) — client_secret OAuth Mercado Pago.
#   MP_OAUTH_REFRESH_TOKEN        (opcional) — refresh token OAuth Mercado Pago.
#
# O modal "Conectar Mercado Pago" no painel (Página 2 → Registrar Despesas)
# ajuda a gerar os valores de MERCADO_PAGO_ACCESS_TOKEN/MP_CONTA_EMAIL (baixa
# os .json prontos) — a chave do Firebase e o cadastro dos Secrets em si
# precisam ser feitos manualmente no GitHub, uma vez.

on:
  schedule:
    # 09:00 America/Sao_Paulo (UTC-3) todo dia -- ajuste à vontade.
    - cron: "0 12 * * *"
  workflow_dispatch: {} # permite rodar manualmente em Actions → Run workflow

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets não podem ser lidos direto num "if:" de step -- por isso viram
    # variáveis de ambiente aqui (isto é permitido/comum) e os "if:" abaixo
    # checam essas variáveis em vez de "secrets.*" diretamente.
    env:
      HAS_REQUIRED_SECRETS: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN != '' && secrets.MP_CONTA_EMAIL != '' && secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
      HAS_OPEN_FINANCE_SECRETS: ${{ secrets.OPEN_FINANCE_TOKEN_ENDPOINT != '' && secrets.OPEN_FINANCE_BASE_URL != '' && secrets.OPEN_FINANCE_CLIENT_ID != '' && secrets.OPEN_FINANCE_CLIENT_SECRET != '' }}
      HAS_MP_OAUTH_SECRETS: ${{ secrets.MP_OAUTH_CLIENT_ID != '' && secrets.MP_OAUTH_CLIENT_SECRET != '' && secrets.MP_OAUTH_REFRESH_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        working-directory: orcamento_agent
        run: pip install requests openpyxl firebase-admin

      - name: "Sem secrets configurados ainda -- avisa e para aqui"
        if: env.HAS_REQUIRED_SECRETS != 'true'
        run: |
          echo "::warning::Secrets obrigatórios ausentes (MERCADO_PAGO_ACCESS_TOKEN / MP_CONTA_EMAIL / FIREBASE_SERVICE_ACCOUNT_JSON). Configure em Settings > Secrets and variables > Actions > New repository secret -- veja os comentários no topo deste workflow ou orcamento_agent/LEIA-ME.md."

      - name: Gravar segredos em arquivos temporários (nunca versionados)
        if: env.HAS_REQUIRED_SECRETS == 'true'
        working-directory: orcamento_agent
        env:
          MP_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          MP_EMAIL: ${{ secrets.MP_CONTA_EMAIL }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          JANELA: ${{ secrets.MP_JANELA_DIAS }}
          OF_TOKEN_ENDPOINT: ${{ secrets.OPEN_FINANCE_TOKEN_ENDPOINT }}
          OF_BASE_URL: ${{ secrets.OPEN_FINANCE_BASE_URL }}
          OF_CLIENT_ID: ${{ secrets.OPEN_FINANCE_CLIENT_ID }}
          OF_CLIENT_SECRET: ${{ secrets.OPEN_FINANCE_CLIENT_SECRET }}
          OF_CARD_TOKEN_SECRET: ${{ secrets.OPEN_FINANCE_CARD_TOKEN_SECRET }}
          MP_OAUTH_CLIENT_ID: ${{ secrets.MP_OAUTH_CLIENT_ID }}
          MP_OAUTH_CLIENT_SECRET: ${{ secrets.MP_OAUTH_CLIENT_SECRET }}
          MP_OAUTH_REFRESH_TOKEN: ${{ secrets.MP_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_SA" > firebase-serviceAccount.json
          dias="${JANELA:-3}"

          python3 - "$MP_TOKEN" "$MP_EMAIL" "$dias" "$OF_TOKEN_ENDPOINT" "$OF_BASE_URL" "$OF_CLIENT_ID" "$OF_CLIENT_SECRET" "$OF_CARD_TOKEN_SECRET" "$MP_OAUTH_CLIENT_ID" "$MP_OAUTH_CLIENT_SECRET" "$MP_OAUTH_REFRESH_TOKEN" <<'PYEOF'
          import json, sys
          token, email, dias = sys.argv[1], sys.argv[2], int(sys.argv[3])
          token_endpoint, base_url, client_id, client_secret, card_token_secret, mp_oauth_client_id, mp_oauth_client_secret, mp_oauth_refresh_token = sys.argv[4:12]

          reconcile_cfg = {
              "mercado_pago_access_token": token,
              "firebase_service_account": "firebase-serviceAccount.json",
              "db_json": None,
              "janela_dias": dias,
          }
          with open("mp_reconcile_config.json", "w", encoding="utf-8") as f:
              json.dump(reconcile_cfg, f)

          expenses_cfg = {
              "mercado_pago_access_token": token,
              "firebase_service_account": "firebase-serviceAccount.json",
              "db_json": None,
              "conta_email": email,
              "janela_dias": dias,
              "categoria_padrao": "Mercado Pago",
              "mapeamento": [
                  {"palavra_chave": "uber", "categoria": "Transporte"},
                  {"palavra_chave": "99", "categoria": "Transporte"},
                  {"palavra_chave": "ifood", "categoria": "Alimentação"},
                  {"palavra_chave": "supermercado", "categoria": "Alimentação"},
                  {"palavra_chave": "farmacia", "categoria": "Saúde"},
              ],
              "ignorar_descricoes_contendo": ["despesa extra", "assinatura", "fintech spacecworp"],
          }
          with open("mp_expenses_config.json", "w", encoding="utf-8") as f:
              json.dump(expenses_cfg, f)

          if token_endpoint and base_url and client_id and client_secret:
              open_finance_cfg = {
                  "provider": "open_finance_mp",
                  "conta_email": email,
                  "mercado_pago_access_token": token,
                  "open_finance_token_endpoint": token_endpoint,
                  "open_finance_base_url": base_url,
                  "open_finance_cards_endpoint": "/cards",
                  "open_finance_transactions_endpoint": "/cards/transactions",
                  "open_finance_client_id": client_id,
                  "open_finance_client_secret": client_secret,
                  "card_token_secret": card_token_secret or client_secret,
                  "firebase_service_account": "firebase-serviceAccount.json",
                  "db_json": None,
                  "janela_dias": dias,
                  "projetar_transacoes_em_despesas": True,
                  "categoria_padrao": "Cartão Mercado Pago",
                  "mapeamento": expenses_cfg["mapeamento"],
                  "ignorar_descricoes_contendo": expenses_cfg["ignorar_descricoes_contendo"],
              }
              with open("mp_open_finance_config.json", "w", encoding="utf-8") as f:
                  json.dump(open_finance_cfg, f)

          if mp_oauth_client_id and mp_oauth_client_secret and mp_oauth_refresh_token:
              oauth_cfg = {
                  "conta_email": email,
                  "mercado_pago_oauth_client_id": mp_oauth_client_id,
                  "mercado_pago_oauth_client_secret": mp_oauth_client_secret,
                  "mercado_pago_oauth_refresh_token": mp_oauth_refresh_token,
                  "firebase_service_account": "firebase-serviceAccount.json",
                  "db_json": None,
                  "janela_dias": dias,
                  "consultar_cobrancas": True,
                  "consultar_saldo": True,
                  "consultar_movimentacoes": True,
                  "projetar_transacoes_em_despesas": True,
                  "categoria_padrao": "Mercado Pago (OAuth)",
                  "mapeamento": expenses_cfg["mapeamento"],
                  "ignorar_descricoes_contendo": expenses_cfg["ignorar_descricoes_contendo"],
              }
              with open("mp_oauth_account_config.json", "w", encoding="utf-8") as f:
                  json.dump(oauth_cfg, f)
          PYEOF

      - name: mp_reconcile.py (confirma cobranças recebidas pelo app)
        if: env.HAS_REQUIRED_SECRETS == 'true'
        working-directory: orcamento_agent
        run: python3 mp_reconcile.py

      - name: mp_expenses.py (gera despesas a partir dos pagamentos)
        if: env.HAS_REQUIRED_SECRETS == 'true'
        working-directory: orcamento_agent
        run: python3 mp_expenses.py

      - name: mp_open_finance_sync.py (sync Open Finance de cartão, opcional)
        if: env.HAS_REQUIRED_SECRETS == 'true' && env.HAS_OPEN_FINANCE_SECRETS == 'true'
        working-directory: orcamento_agent
        run: python3 mp_open_finance_sync.py

      - name: mp_oauth_account_sync.py (sync OAuth da conta MP, opcional)
        if: env.HAS_REQUIRED_SECRETS == 'true' && env.HAS_MP_OAUTH_SECRETS == 'true'
        working-directory: orcamento_agent
        run: python3 mp_oauth_account_sync.py

      - name: Limpar arquivos com segredos
        if: always()
        working-directory: orcamento_agent
        run: |
          rm -f firebase-serviceAccount.json mp_reconcile_config.json mp_expenses_config.json mp_open_finance_config.json mp_oauth_account_config.json
