spring.application.name=fintech-api
server.port=8080
app.jwt.secret=${APP_JWT_SECRET:change-me-in-prod-with-a-long-random-secret-value-1234567890}
app.jwt.ttl-seconds=3600
logging.level.root=INFO
logging.level.com.spacecworp.fintechapi=INFO
app.notifications.registration-email.enabled=${APP_REGISTRATION_EMAIL_ENABLED:true}
app.notifications.registration-email.from=${APP_REGISTRATION_EMAIL_FROM:no-reply@spacecworp.com}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
